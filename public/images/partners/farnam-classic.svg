<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@1,900&amp;display=swap');
      .farnam-text {
        font-family: 'Merriweather', 'Georgia', serif;
        font-size: 78px;
        font-weight: 900;
        font-style: italic;
        fill: #FFFFFF;
        letter-spacing: -1.5px;
      }
    </style>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00c0f3" />
      <stop offset="50%" stopColor="#00a3e0" />
      <stop offset="100%" stopColor="#0072bc" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffc72c" />
      <stop offset="100%" stopColor="#f39200" />
    </linearGradient>
  </defs>

  <!-- Left Deep Blue Arc -->
  <path d="M 120 40 C 40 70 10 110 10 125 C 10 140 40 180 120 205 L 145 180 C 85 160 60 135 60 125 C 60 115 85 90 145 68 Z" fill="#0c4a8a" />

  <!-- Right Golden Arc -->
  <path d="M 360 40 C 440 70 470 110 470 125 C 470 140 440 180 360 205 L 340 180 C 400 160 420 135 420 125 C 420 115 400 90 340 68 Z" fill="url(#yellowGrad)" />

  <!-- Main Center Cyan Ellipse -->
  <ellipse cx="240" cy="122" rx="195" ry="68" fill="url(#cyanGrad)" />

  <!-- Inner Subtle Highlights -->
  <ellipse cx="240" cy="122" rx="193" ry="66" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.4" />

  <!-- Farnam Brand Text -->
  <text x="236" y="148" text-anchor="middle" class="farnam-text">Farnam</text>
  <circle cx="395" cy="115" r="7" fill="none" stroke="#ffffff" stroke-width="1.8" />
  <text x="395" y="119" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">R</text>
</svg>
